<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Fixed title: the server finds this window by name to tuck it inside the
     frameless host window. The host is what shows up in TikTok Studio. -->
<title>Awesome Music Streaming Deck - Now Playing (source)</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="stylesheet" href="transport.css">
<link rel="stylesheet" href="nowplaying.css">
</head>
<body>

<div id="stage" class="stage layout-bar" data-state="idle">

  <div id="bgImage" class="bg-image"></div>
  <div id="bgDim" class="bg-dim"></div>

  <div id="stickersBack" class="stickers stickers-back"></div>

  <div class="card" id="card">
    <div class="card-bg" id="cardBg"></div>
    <div class="art-wrap" id="artWrap">
      <img id="art" class="art" alt="">
      <div id="artFallback" class="art art-fallback">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
      </div>
      <div class="bars" id="bars"><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="info">
      <div class="label-row">
        <span id="label" class="label">NOW PLAYING</span>
        <span id="kaomoji" class="kaomoji"></span>
        <span id="source" class="source-badge"></span>
      </div>
      <div class="title-clip">
        <div id="title" class="title">Nothing playing</div>
      </div>
      <div class="artist-clip">
        <div id="artist" class="artist"></div>
      </div>
      <div id="progressWrap" class="progress">
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
        <div class="times"><span id="elapsed">0:00</span><span id="remain">0:00</span></div>
      </div>
      <div id="transport" class="transport-row" hidden></div>
    </div>
  </div>

  <div id="decor" class="decor" aria-hidden="true">
    <div class="decor-strip decor-top"><span></span></div>
    <div class="decor-strip decor-bottom"><span></span></div>
    <div class="decor-strip decor-left"><span></span></div>
    <div class="decor-strip decor-right"><span></span></div>
  </div>

  <div id="stickersFront" class="stickers stickers-front"></div>

  <!-- Only visible while the mouse is over the window, so it never lands on stream. -->
  <div class="handles">
    <div class="hint">drag to move</div>
    <button id="closeBtn" class="close" title="Close (also Alt+F4)">&times;</button>
    <div id="grip" class="grip" title="Drag to resize"></div>
  </div>

  <div id="offline" class="offline">Deck disconnected &mdash; reconnecting&hellip;</div>
</div>

<script src="scenes.js"></script>
<script src="decor.js"></script>
<script src="transport.js"></script>
<script src="nowplaying.js"></script>
</body>
</html>
