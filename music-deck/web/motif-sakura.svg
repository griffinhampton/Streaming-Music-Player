<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="p" cx="50%" cy="85%" r="80%">
      <stop offset="0%"  stop-color="#fff1f7"/>
      <stop offset="55%" stop-color="#ffd3e6"/>
      <stop offset="100%" stop-color="#ffb0d2"/>
    </radialGradient>
    <radialGradient id="ps" cx="50%" cy="80%" r="85%">
      <stop offset="0%"  stop-color="#fff4f9"/>
      <stop offset="100%" stop-color="#ffc2dc"/>
    </radialGradient>
    <!-- one petal, tip up, with the little notch sakura petals have -->
    <path id="pt" d="M0,0 C-4.6,-2.6 -6.1,-9.1 -2.7,-12.6 C-1.7,-14 -0.9,-12.8 0,-11.2
                     C0.9,-12.8 1.7,-14 2.7,-12.6 C6.1,-9.1 4.6,-2.6 0,0 Z"/>
    <path id="pt-s" d="M0,0 C-2.5,-1.4 -3.3,-4.9 -1.5,-6.8 C-0.9,-7.6 -0.5,-6.9 0,-6
                       C0.5,-6.9 0.9,-7.6 1.5,-6.8 C3.3,-4.9 2.5,-1.4 0,0 Z"/>
    <g id="blossom">
      <use href="#pt" fill="url(#p)" stroke="#f79ac4" stroke-width=".5" stroke-opacity=".55"/>
      <use href="#pt" fill="url(#p)" stroke="#f79ac4" stroke-width=".5" stroke-opacity=".55" transform="rotate(72)"/>
      <use href="#pt" fill="url(#p)" stroke="#f79ac4" stroke-width=".5" stroke-opacity=".55" transform="rotate(144)"/>
      <use href="#pt" fill="url(#p)" stroke="#f79ac4" stroke-width=".5" stroke-opacity=".55" transform="rotate(216)"/>
      <use href="#pt" fill="url(#p)" stroke="#f79ac4" stroke-width=".5" stroke-opacity=".55" transform="rotate(288)"/>
      <circle r="2.5" fill="#fff6e2"/>
      <g fill="#f8a8c8">
        <circle cx="0"    cy="-4.2" r=".75"/>
        <circle cx="4"    cy="-1.3" r=".75"/>
        <circle cx="2.5"  cy="3.4"  r=".75"/>
        <circle cx="-2.5" cy="3.4"  r=".75"/>
        <circle cx="-4"   cy="-1.3" r=".75"/>
      </g>
    </g>
    <g id="petal-s">
      <use href="#pt-s" fill="url(#ps)" stroke="#f79ac4" stroke-width=".4" stroke-opacity=".45"/>
    </g>
  </defs>

  <g transform="translate(24 23)"><use href="#blossom"/></g>
  <g transform="translate(6 9)  rotate(-28)"><use href="#petal-s"/></g>
  <g transform="translate(42 38) rotate(35)"><use href="#petal-s"/></g>
</svg>
