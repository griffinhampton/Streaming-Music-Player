<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 24" width="48" height="24">
  <!-- Seigaiha: the traditional overlapping-wave pattern, in pastel pink. -->
  <defs>
    <g id="fan" fill="none" stroke-linecap="round">
      <circle r="12" stroke="#f7b3d2" stroke-width="1.5"/>
      <circle r="9"  stroke="#ffd9ea" stroke-width="1.3"/>
      <circle r="6"  stroke="#f7b3d2" stroke-width="1.1"/>
      <circle r="3"  stroke="#ffd9ea" stroke-width="1"/>
    </g>
  </defs>
  <use href="#fan" transform="translate(0 24)"/>
  <use href="#fan" transform="translate(24 24)"/>
  <use href="#fan" transform="translate(48 24)"/>
  <use href="#fan" transform="translate(-12 12)"/>
  <use href="#fan" transform="translate(12 12)"/>
  <use href="#fan" transform="translate(36 12)"/>
  <use href="#fan" transform="translate(60 12)"/>
</svg>
