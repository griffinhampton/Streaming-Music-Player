<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Fixed title: the server finds this window by name to tuck it inside its
     frameless host. The host ("Awesome Music Streaming Deck - Lyrics") is what capture sees. -->
<title>Awesome Music Streaming Deck - Lyrics (source)</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="stylesheet" href="transport.css">
<link rel="stylesheet" href="lyrics.css">
</head>
<body>

<div id="stage" class="stage" data-state="idle">
  <div id="bgImage" class="bg-image"></div>
  <div id="bgDim" class="bg-dim"></div>

  <div class="card" id="card">
    <div class="card-bg" id="cardBg"></div>
    <div id="header" class="header"></div>
    <div class="viewport" id="viewport">
      <div id="lines" class="lines"></div>
    </div>
    <div id="status" class="status"></div>
  </div>

  <!-- Only visible while the mouse is over the window, so it never lands on stream. -->
  <div class="handles">
    <div class="hint">drag to move &middot; edges resize &middot; &minus; hides it</div>
    <button id="minBtn"   class="winbtn min"   title="Hide &mdash; find it on the taskbar">&minus;</button>
    <button id="closeBtn" class="winbtn close" title="Close (also Alt+F4)">&times;</button>
    <div class="rz rz-n" data-edge="t"></div>  <div class="rz rz-s" data-edge="b"></div>
    <div class="rz rz-w" data-edge="l"></div>  <div class="rz rz-e" data-edge="r"></div>
    <div class="rz rz-nw" data-edge="tl"></div><div class="rz rz-ne" data-edge="tr"></div>
    <div class="rz rz-sw" data-edge="bl"></div>
    <div id="grip" class="rz rz-se grip" data-edge="br" title="Drag to resize"></div>
  </div>

  <div id="offline" class="offline">Deck disconnected &mdash; reconnecting&hellip;</div>
  <div id="transport" class="transport-row" hidden></div>
</div>

<script src="scenes.js"></script>
<script src="windowctl.js"></script>
<script src="transport.js"></script>
<script src="lyrics.js"></script>
</body>
</html>
