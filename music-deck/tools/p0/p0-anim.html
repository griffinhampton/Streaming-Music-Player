<!doctype html>
<meta charset="utf-8">
<title>P0 Anim</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #123; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
<canvas id="c"></canvas>
<script>
  // A constantly changing test source: grid, a moving square, and frame
  // counters at the top and the bottom (so off-screen parts can be checked).
  const q = new URLSearchParams(location.search);
  document.title = q.get('title') || 'P0 Anim';
  const label = q.get('label') || '';
  const fps = +q.get('fps') || 60;
  const c = document.getElementById('c'), g = c.getContext('2d');
  let n = 0, last = 0;
  function size() { c.width = innerWidth; c.height = innerHeight; }
  addEventListener('resize', size); size();
  function draw() {
    n++;
    const w = c.width, h = c.height;
    g.fillStyle = `hsl(${(n * 2) % 360} 55% 28%)`; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 1;
    for (let x = 0; x < w; x += 100) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, h); g.stroke(); }
    for (let y = 0; y < h; y += 100) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(w, y + .5); g.stroke(); }
    g.fillStyle = '#fff'; g.font = 'bold 44px system-ui';
    g.fillText(`${label} TOP ${n}`, 20, 56);
    g.fillText(`${label} BOTTOM ${n}  ${w}x${h}`, 20, h - 24);
    g.fillStyle = '#f0f'; g.fillRect((n * 9) % Math.max(1, w - 80), h / 2 - 40, 80, 80);
  }
  function loop(t) { requestAnimationFrame(loop); if (t - last < 1000 / fps - 2) return; last = t; draw(); }
  requestAnimationFrame(loop);
</script>
