<!doctype html>
<meta charset="utf-8">
<title>P0 Media</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; }
</style>
<video id="v" autoplay muted playsinline></video>
<script>
  const v = document.getElementById('v');
  const info = s => { const t = s.getVideoTracks()[0]; return JSON.stringify({ label: t.label, settings: t.getSettings() }); };
  const timeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timed out - picker shown?')), ms))]);
  window.start = async (fps = 30) => {
    try {
      const s = await timeout(navigator.mediaDevices.getDisplayMedia({ video: { frameRate: fps }, audio: false }), 8000);
      v.srcObject = s; return info(s);
    } catch (e) { return 'ERROR ' + e.name + ': ' + e.message; }
  };
  window.cam = async (w = 1920, h = 1080, fps = 30) => {
    try {
      const s = await timeout(navigator.mediaDevices.getUserMedia({ video: { width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: fps } }, audio: false }), 8000);
      v.srcObject = s; return info(s);
    } catch (e) { return 'ERROR ' + e.name + ': ' + e.message; }
  };
  // Frames actually painted by the <video> over two seconds.
  window.fps = () => new Promise(r => {
    let n = 0; const t0 = performance.now();
    setTimeout(() => r(`no frames in 4 s (${v.videoWidth}x${v.videoHeight})`), 4000);
    const cb = () => { n++; if (performance.now() - t0 < 2000) v.requestVideoFrameCallback(cb); else r((n / ((performance.now() - t0) / 1000)).toFixed(1) + ` fps, ${v.videoWidth}x${v.videoHeight}`); };
    v.requestVideoFrameCallback(cb);
  });
</script>
